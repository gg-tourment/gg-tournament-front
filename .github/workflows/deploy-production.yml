name: 프론트엔드 운영 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  PROJECT_ID: gg-tournament-prod-2465
  REGION: asia-northeast3
  SERVICE: gg-tournament-front
  IMAGE: asia-northeast3-docker.pkg.dev/gg-tournament-prod-2465/gg-tournament/frontend:latest

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 운영 빌드
        env:
          VITE_API_BASE_URL: https://34-47-65-133.sslip.io/api
          VITE_TOSS_CLIENT_KEY: test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm
        run: npm run build

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/321099608458/locations/global/workloadIdentityPools/github-actions/providers/gg-tournament-front
          service_account: github-frontend-deploy@gg-tournament-prod-2465.iam.gserviceaccount.com

      - name: Google Cloud CLI 설정
        uses: google-github-actions/setup-gcloud@v3

      - name: 컨테이너 이미지 빌드
        run: >-
          gcloud builds submit
          --project="${PROJECT_ID}"
          --region="${REGION}"
          --config=deploy/gcp/cloudbuild.yaml
          .

      - name: Cloud Run 배포
        run: >-
          gcloud run deploy "${SERVICE}"
          --project="${PROJECT_ID}"
          --region="${REGION}"
          --image="${IMAGE}"
          --allow-unauthenticated
          --port=8080
          --memory=256Mi
          --cpu=1
          --concurrency=80
          --min-instances=0
          --max-instances=2
          --quiet

      - name: 공개 헬스 체크
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://gg-tournament-front-321099608458.asia-northeast3.run.app/app-health
